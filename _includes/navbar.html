<nav class="navbar navbar-expand-sm navbar-light fixed-top site-navbar" aria-label="Primary navigation">
  <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
    <a class="navbar-brand site-navbar-brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.navbar_name }} home">
      <img
        src="{{ '/assets/images/covers/joyvoice_logo.svg' | relative_url }}"
        alt=""
        class="site-navbar-logo"
        width="123"
        height="40">
      <span class="site-navbar-name">{{ site.data.profile.navbar_name }}</span>
    </a>

    <button class="navbar-toggler site-navbar-toggle" type="button"
            data-toggle="collapse" data-target="#navbarResponsive"
            aria-controls="navbarResponsive" aria-expanded="false"
            aria-label="Open navigation menu">
      <span class="site-navbar-toggle-icon" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span class="site-navbar-toggle-label">Menu</span>
    </button>

    <div class="collapse navbar-collapse" id="navbarResponsive">
      <ul class="navbar-nav ml-auto">
        {% for item in site.data.navigation.pages %}
        {% assign is_current = false %}
        {% if item.name == page.navbar_title %}{% assign is_current = true %}{% endif %}
        <li class="nav-item{% if is_current %} active{% endif %}">
          <a class="nav-link site-nav-link" href="{{ item.url | relative_url }}"{% if is_current %} aria-current="page"{% endif %}>
            {{ item.name }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </div>
  </div>
</nav>
